interface:
  display_name: "Obsidian 第二大脑"
  short_description: "查询本地编译证据；写入和撤销始终由你确认"
  default_prompt: "Use $obsidian-knowledge to query my permission-filtered compiled evidence. Follow the configured private review for query transmission, and never write or roll back a source unless I explicitly request it and approve the exact local review."

dependencies:
  tools:
    - type: "mcp"
      value: "obsidian_knowledge"
      description: "Compiled local Obsidian evidence with private human-approved controlled writes"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
